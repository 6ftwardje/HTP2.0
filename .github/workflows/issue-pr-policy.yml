name: Issue and PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  validate-and-sync-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one closing backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!/^(feat|fix|docs)\/[A-Z]\d+\.\d+-[a-z0-9-]+$/.test(pr.head.ref)) core.setFailed(`Branch '${pr.head.ref}' volgt niet feat|fix|docs/<taakcode>-<naam>.`);
            if (!(pr.body || '').includes('## Testbewijs') || !(pr.body || '').includes('Bewust niet uitgevoerd')) core.setFailed('PR mist het verplichte testbewijs of de bewust niet uitgevoerde controles.');
            const matches = [...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)];
            const numbers = [...new Set(matches.map(match => Number(match[1])))];
            if (numbers.length !== 1) core.setFailed(`Expected exactly one closing issue reference; found ${numbers.length}.`);
            if (numbers.length !== 1) return;
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: numbers[0] });
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            if (!labels.includes('backlog')) core.setFailed(`#${numbers[0]} is not labelled backlog.`);
            if (!/^\[[A-Z]\d+\.\d+\]\s+\S/.test(issue.title)) core.setFailed(`#${numbers[0]} has no valid task code title.`);
            if (issue.state !== 'open' && pr.state === 'open') core.setFailed(`#${numbers[0]} is niet open.`);
            if (pr.state === 'open') {
              const next = labels.filter(label => !['status:todo', 'status:done'].includes(label));
              if (!next.includes('status:in-progress')) next.push('status:in-progress');
              await github.rest.issues.setLabels({ ...context.repo, issue_number: numbers[0], labels: next });
            } else if (!pr.merged && issue.state === 'open') {
              const next = labels.filter(label => !['status:in-progress', 'status:done'].includes(label));
              if (!next.includes('status:todo')) next.push('status:todo');
              await github.rest.issues.setLabels({ ...context.repo, issue_number: numbers[0], labels: next });
            }
  sync-closed-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            if (!labels.includes('backlog')) return;
            const status = context.payload.action === 'closed' ? 'status:done' : 'status:todo';
            const next = labels.filter(label => !label.startsWith('status:'));
            next.push(status);
            await github.rest.issues.setLabels({ ...context.repo, issue_number: issue.number, labels: next });
