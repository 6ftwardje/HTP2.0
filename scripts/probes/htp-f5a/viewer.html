<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTP — PDF-proef</title>
<style>
:root{color-scheme:dark;--background:#0d0f14;--card:#161a21;--foreground:#e8eaed;--muted:#9ba1ac;--accent:#7c6cf0;--border:#646c7a}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.6 Arial,sans-serif}button,select{font:inherit;min-height:44px;padding:7px 12px;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:6px}button{cursor:pointer}button:hover{background:#1d222b}button:disabled{opacity:.6;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}main{max-width:64ch;margin:10vh auto;padding:24px}h1{font-size:28px;line-height:1.2}p{color:var(--muted)}dialog{padding:0;border:0;max-width:none;max-height:none;width:100vw;height:100dvh;margin:0;inset:0;overflow:hidden;background:var(--background);color:var(--foreground)}dialog[open]{display:grid;grid-template-rows:auto auto minmax(0,1fr)}dialog::backdrop{background:var(--background)}header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);flex-wrap:wrap}h2{font-size:16px;font-weight:600;margin:0 auto 0 0}#viewport{min-height:0;overflow:auto;padding:24px 12px;overscroll-behavior:contain}#pages{width:fit-content;min-width:100%;margin:auto}.page{position:relative;background:#fff;margin:0 auto 24px;color:#14161c;box-shadow:0 3px 12px #0005}canvas{display:block}#text{max-width:70ch;margin:auto;padding:24px;background:#fff;color:#14161c}#text p{color:#14161c}.note{padding:8px 20px;margin:0;font-size:13px}#error{padding:24px;color:var(--foreground)}[hidden]{display:none!important}@media(max-width:600px){header{padding:10px;gap:8px}h2{width:calc(100% - 85px)}#viewport{padding:16px 8px}.note{padding:8px 10px}}@media print{body>*{display:none!important}}
</style>
<main><h1>PDF-leesproef</h1><p>Technische proef met uitsluitend synthetische inhoud. Dit is geen aangesloten of beveiligde productviewer.</p><button id="open">Open testdocument</button></main>
<dialog id="dialog" aria-labelledby="title"><header><h2 id="title">Een rustig handelsplan · proef</h2><button id="close" aria-label="Sluiten">Sluiten</button><span id="count" aria-live="polite">Laden…</span><button id="minus" aria-label="Uitzoomen">−</button><button id="plus" aria-label="Inzoomen">+</button><button id="fit">Passend</button><select id="mode" aria-label="Leesweergave"><option value="canvas">Paginaweergave</option><option value="text">Tekstweergave · proef</option></select></header><p class="note">Persoonlijk watermerk in geleverde PDF. Screenshots en kopiëren blijven technisch mogelijk.</p><div id="viewport" tabindex="0" aria-label="Documentpagina’s"><div id="error" role="alert" hidden></div><div id="pages"></div><section id="text" aria-label="Tekst van huidige pagina" hidden></section></div></dialog>
<script type="module">
import * as pdfjs from '/vendor/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.mjs';
const $=id=>document.getElementById(id),dialog=$('dialog'),viewport=$('viewport'),pages=$('pages'),text=$('text');
const params=new URL(location.href).searchParams;let pdf,loading,current=1,zoom=1,epoch=0,observer,slots=[],chain=Promise.resolve(),pageRatio=842/595;const visibility=new Map();
const tasks=new Set();window.probe={ready:false,metrics:()=>({canvases:pages.querySelectorAll('canvas').length,canvasBytes:[...pages.querySelectorAll('canvas')].reduce((n,c)=>n+c.width*c.height*4,0),pages:pdf?.numPages??0,current,zoom,heap:performance.memory?.usedJSHeapSize??null})};
function clearCanvases(){for(const task of tasks)task.cancel();tasks.clear();for(const c of pages.querySelectorAll('canvas')){c.width=0;c.height=0;c.remove();}}
async function render(number,version){if(version!==epoch||!pdf||!dialog.open)return;clearCanvases();current=number;$('count').textContent=`${number} / ${pdf.numPages}`;
 if($('mode').value==='text'){
  const page=await pdf.getPage(number),content=await page.getTextContent();if(version!==epoch)return;text.replaceChildren();const heading=document.createElement('h3');heading.textContent=`Pagina ${number}`;text.append(heading);const para=document.createElement('p');para.textContent=content.items.filter(x=>'str'in x).map(x=>x.str).join(' ');text.append(para);page.cleanup();window.probe.ready=true;return;
 }
 for(let n=Math.max(1,number-1);n<=Math.min(pdf.numPages,number+1);n++){
  if(version!==epoch)return;const page=await pdf.getPage(n);if(version!==epoch||!dialog.open){page.cleanup();return;}const unit=page.getViewport({scale:1});const width=Math.max(240,viewport.clientWidth-24),cssScale=Math.min(width/ unit.width,1.25)*zoom,view=page.getViewport({scale:cssScale});
  const ratio=Math.min(devicePixelRatio,Math.sqrt(2000000/(view.width*view.height)));const canvas=document.createElement('canvas');canvas.width=Math.floor(view.width*ratio);canvas.height=Math.floor(view.height*ratio);canvas.style.width=`${view.width}px`;canvas.style.height=`${view.height}px`;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`Pagina ${n}; kies Tekstweergave voor leesbare tekst`);slots[n-1].append(canvas);
  const task=page.render({canvas,viewport:view,transform:ratio===1?null:[ratio,0,0,ratio,0,0],annotationMode:pdfjs.AnnotationMode.DISABLE});tasks.add(task);try{await task.promise;}catch(e){if(e.name!=='RenderingCancelledException')throw e;}finally{tasks.delete(task);page.cleanup();}
 }
 if(version===epoch)window.probe.ready=true;
}
function request(n){window.probe.ready=false;const version=++epoch;for(const t of tasks)t.cancel();chain=chain.catch(()=>{}).then(()=>render(n,version)).catch(()=>{$('error').hidden=false;$('error').textContent='Deze pagina kon niet worden getoond. Sluit en open de proef opnieuw.';});}
async function open(){dialog.showModal();current=1;zoom=1;$('close').focus();$('error').hidden=true;window.probe.ready=false;
 try{loading=pdfjs.getDocument({url:'/fixture?case='+encodeURIComponent(params.get('case')??'large')+'&viewer='+encodeURIComponent(params.get('viewer')??'a'),standardFontDataUrl:'/vendor/fonts/',isEvalSupported:false,stopAtErrors:true,disableAutoFetch:true,disableStream:true,enableXfa:false});pdf=await loading.promise;const first=await pdf.getPage(1),v=first.getViewport({scale:1});first.cleanup();pageRatio=v.height/v.width;pages.replaceChildren();visibility.clear();slots=[];
  for(let i=1;i<=pdf.numPages;i++){const slot=document.createElement('div');slot.className='page';slot.dataset.page=i;slot.style.width=`${Math.min(viewport.clientWidth-24,745)*zoom}px`;slot.style.height=`${(Math.min(viewport.clientWidth-24,745)*zoom)*v.height/v.width}px`;slots.push(slot);pages.append(slot);}
  observer=new IntersectionObserver(entries=>{for(const entry of entries)visibility.set(Number(entry.target.dataset.page),entry.intersectionRatio);const visible=[...visibility].filter(([,ratio])=>ratio>0).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);if(visible[0]){const n=visible[0][0];if(n!==current)request(n);}},{root:viewport,threshold:[.1,.5,.9]});slots.forEach(x=>observer.observe(x));request(1);
 }catch(e){$('count').textContent='Niet beschikbaar';$('error').hidden=false;$('error').textContent=e.name==='PasswordException'?'Dit document is versleuteld. Gebruik een versie zonder wachtwoord.':'Deze PDF is beschadigd of kan niet worden gelezen.';window.probe.error=e.name;}}
function zoomTo(value){zoom=Math.max(.5,Math.min(2,value));for(const slot of slots){const width=Math.min(viewport.clientWidth-24,745)*zoom;slot.style.width=`${width}px`;slot.style.height=`${width*pageRatio}px`;}slots[current-1]?.scrollIntoView({block:'start'});request(current);}
$('open').onclick=open;$('close').onclick=()=>dialog.close();$('plus').onclick=()=>zoomTo(zoom+.25);$('minus').onclick=()=>zoomTo(zoom-.25);$('fit').onclick=()=>zoomTo(1);
$('mode').onchange=()=>{const accessible=$('mode').value==='text';text.hidden=!accessible;pages.hidden=accessible;request(current);};
dialog.addEventListener('close',()=>{epoch++;observer?.disconnect();clearCanvases();loading?.destroy();pdf=null;pages.replaceChildren();$('open').focus();});
window.probe.page=number=>{slots[number-1].scrollIntoView({block:'start'});request(number);};
</script></html>
